<script>
const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (window.innerWidth <= 768 && window.innerHeight <= 1024);
if (isMobileDevice) {
    document.body.innerHTML = '<div style="text-align: center; margin-top: 50px; font-family: monospace; font-size: 18px;">Device not supported.</div>';
} else {
    const script = document.createElement('script');
    script.type = 'module';
    script.textContent = `
        import init from "./pkg/peroxide.js";
        init().catch(alert);
    `;
    document.head.appendChild(script);
}
</script>

</html>
